<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CV Insight">
  <!--
    The app mark: the brand green (#10B981, SPEC Block E "Color tokens") with a
    white check. A check because the product's job is to tell you whether your
    resume actually matches the posting — the same idea the Match Rate ring and
    the judge's verdict carry.

    Drawn for 16 px first. At tab size nothing survives but a silhouette, so the
    shape is one filled square and one thick stroke: no text, no gradient, no
    thin detail. The violet accent is deliberately absent — SPEC allows it as one
    hero action per screen, and a 16 px icon is not the place for a second colour.

    This SVG is the source of truth for src/app/favicon.ico beside it, which
    exists only because browsers and link-unfurlers still request /favicon.ico by
    path. Regenerate the .ico from this if the mark ever changes.
  -->
  <rect width="32" height="32" rx="7" fill="#10B981"/>
  <path d="M9 16.5 L14 21.5 L23.5 11"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
